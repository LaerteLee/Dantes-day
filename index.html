<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário, Dante!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Balões animados ao fundo */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            background-color: #ff6b6b;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: flyUp 6s infinite ease-in-out;
            opacity: 0.7;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 28px;
            width: 2px;
            height: 15px;
            background-color: #888;
        }

        .balloon:nth-child(1) { left: 10%; background-color: #ff6b6b; animation-delay: 0s; animation-duration: 5s; }
        .balloon:nth-child(2) { left: 30%; background-color: #48dbfb; animation-delay: 2s; animation-duration: 7s; }
        .balloon:nth-child(3) { left: 50%; background-color: #feca57; animation-delay: 1s; animation-duration: 6s; }
        .balloon:nth-child(4) { left: 70%; background-color: #ff9ff3; animation-delay: 3s; animation-duration: 8s; }
        .balloon:nth-child(5) { left: 90%; background-color: #1dd1a1; animation-delay: 1.5s; animation-duration: 5.5s; }

        @keyframes flyUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(15deg);
                opacity: 0;
            }
        }

        /* Cartão Pop-up Central */
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            z-index: 10;
            max-width: 400px;
            width: 90%;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #2d3748;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .prize-box {
            background: #fff8f0;
            border: 2px dashed #f6ad55;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .prize-title {
            font-size: 14px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .prize-value {
            font-size: 32px;
            font-weight: bold;
            color: #dd6b20;
        }

        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <!-- Balões flutuantes -->
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <!-- Caixa Pop-up de Mensagem -->
    <div class="card">
        <h1>🎉 Feliz Aniversário, Dante! 🎂</h1>
        <p>Você escaneou o código premiado!</p>
        
        <div class="prize-box">
            <div class="prize-title">Você acaba de ganhar:</div>
            <div class="prize-value" id="valorPremio">Carregando prêmio...</div>
        </div>

        <p>Aproveite o seu dia ao máximo!</p>
        <div class="footer">Parabéns pelo seu dia!</div>
    </div>

    <script>
        // Pega o valor enviado na URL (ex: index.html?premio=R$3,00)
        const params = new URLSearchParams(window.location.search);
        const premio = params.get('premio');

        const elementoPremio = document.getElementById('valorPremio');
        if (premio) {
            elementoPremio.textContent = decodeURIComponent(premio);
        } else {
            elementoPremio.textContent = "R$ 3,00"; // Valor padrão caso abra direto
        }
    </script>
</body>
</html>
